<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
    <form class="open-sans-regular">
        <label for="Nama">Nama</label>
        <input name="username" title="Name" id="User_inp1" required></input>
        <label for="Pekerjaan">Pekerjaan</label>
        <input name="pekerjaan" title="Pekerjaan" id="User_inp2" required></input>
        <input id="btn-Result" type="submit" value="Submit">
    </form>

    <p class="judul open-sans-regular">Result</p>
    <table class="open-sans-regular result">
        <tr>
            <th>Id</th>
            <th>Nama</th>
            <th>Pekerjaan</th>
        </tr>
        
    </table>
    <script src="/script.js"></script>
</body>
</html>
