<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input data karyawan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="open-sans-regular">
    <div class="container">
        <h2>Tambah Data Karyawan</h2>
        <form>
            <div class="form-group">
                <label for="User_inp1">Nama</label>
                <input name="username" title="Name" id="User_inp1" required placeholder="Masukkan nama...">
            </div>
            
            <div class="form-group">
                <label for="User_inp2">Pekerjaan</label>
                <input name="pekerjaan" title="Pekerjaan" id="User_inp2" required placeholder="Masukkan pekerjaan...">
            </div>

            <input id="btn-Result" class="SubmitBtn" type="submit" value="Submit">
        </form>

        <div class="header-action">
            <h3 class="judul">Result</h3>
        </div>

        <table id="table" class="result">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nama</th>
                    <th>Pekerjaan</th>
                    <!-- <th>Ubah Data</th> -->
                    <th>Hapus Data</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <ul id="displayData"></ul>
    </div>

    <script src="/script.js"></script>
</body>
</html>
